spring:
  application:
    name: lrt-service
  datasource:
    url: jdbc:postgresql://localhost:5432/dev
    username: postgres
    password: dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
